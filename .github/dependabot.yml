# Dependabot will run on day 14 of each month at 02:29 (Europe/Berlin timezone)
version: 2
updates:

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      timezone: "Europe/Berlin"
    target-branch: "master"
    open-pull-requests-limit: 30
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'cron'
      timezone: 'Europe/Berlin'
      cronjob: '44 2 27 * *'
    open-pull-requests-limit: 15
